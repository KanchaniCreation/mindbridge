spring:
  application:
    name: mindbridge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindbridge}
    username: ${DB_USERNAME:mindbridge}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

mindbridge:
  version: 0.1.0
